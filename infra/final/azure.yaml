name: secretless-azure-secure-final
metadata:
  template: secretless-conference-demo

infra:
  path: ..

workflows:
  up:
    steps:
      - azd: restore
      - azd: provision --location swedencentral
      - azd: package --all
      - azd: deploy --all

hooks:
  predeploy:
    shell: sh
    run: bash ./prepare-deploy.sh
  postdeploy:
    shell: sh
    run: bash ./apply.sh

services:
  api:
    project: ../../src/client/Secretless.AzureSecureDemo.csproj
    host: appservice
    language: dotnet
